version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: hobits-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-hobits}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-hobits}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - hobits-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-hobits}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped


  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: hobits-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - hobits-network
    restart: unless-stopped

  # HobitsService - Backend gRPC Server
  hobits-service:
    build:
      context: ./HobitsService
      dockerfile: Dockerfile
    container_name: hobits-service
    environment:
      ENV: docker
      GRPC_PORT: 50051
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${DB_USER:-hobits}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DBNAME: ${DB_NAME:-hobits}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    ports:
      - "50051:50051"
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - hobits-network
    restart: unless-stopped
    volumes:
      - ./HobitsService/migrations:/app/migrations
      - ./HobitsService/logs:/app/logs

  # HobitsBot - Telegram Bot
  hobitsbot:
    build:
      context: ./HobitsBot
      dockerfile: Dockerfile
    container_name: hobitsbot
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      GRPC_SERVER_ADDR: ${GRPC_SERVER_ADDR:-hobits-service:50051}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      - hobits-service
    networks:
      - hobits-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3-management
    container_name: hobits-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - hobits-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: hobits-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./HobitsService/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    depends_on:
      - hobits-service
    networks:
      - hobits-network
    restart: unless-stopped

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: hobits-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./HobitsService/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - hobits-network
    restart: unless-stopped

volumes:
  postgres_data:
  pgadmin_data:
  prometheus_data:
  grafana_data:
  rabbitmq_data:

networks:
  hobits-network:
    driver: bridge
